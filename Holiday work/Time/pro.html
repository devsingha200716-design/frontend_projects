<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download UI</title>
    <link rel="stylesheet" href="pro.css">
</head>
<body>

    <div class="card">

        <h2 id="h2">Downloading...</h2>

        <div class="progress-box">
            <div class="progress"></div>
        </div>

        <div class="info">
            <span id="going">0%</span>
            <span><span id ="zero">0</span> MB / 100 MB</span>
        </div>

        <button id ="sd">Start Download</button>

    </div>
    
    
    <script src="pro.js"></script>
</body>
</html>
