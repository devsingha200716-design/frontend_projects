<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
        }
        #main{
            width: 100%;
            height: 100%;
            background-color: grey;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #input2{
            display: none;
        }
        #div2btn{
            padding: 12px 22px;
            background-color: rgb(80, 80, 218);
            border-radius: 20px;
            color: white;
            font-weight: 600;
            user-select: none;
        }
        #div2btn:hover{
            background-color: rgb(3, 3, 255);
        }
    </style>
</head>
<body>
    <div id="main">
        <input id="input2" type="file">
        <div id="div2btn">
            Upload File
        </div>
    </div>

    <script src="5.js"></script>
</body>
</html>
