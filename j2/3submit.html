    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        html,body{
            height: 100%;
            width: 100%;
        }
        #main{
            height: 100%;
            width: 100%;
            background-color: rgb(3, 3, 3);
            display: flex;
            align-items: center;
            justify-content: center;
            /* padding: 50px 50px; */

        }
        input{
            display: block;
        }
        .card{
            margin-left: 40px;
            /* display: block; */
            /* height: 100px; */
            max-width: 300px;
            /* margin-top: 40px; */
            /* display: inline-block; */
            padding: 20px;
            border: 3px solid rgb(250, 250, 250);
            /* background-color: rgb(89, 108, 108); */
            border-radius: 10px;
            color: white;
        }
        .profile{
            height: 50px;
            width: 50px;
            /* background-color: red; */
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;

        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card p{
            font-size: 12px;
            margin-top: 5px;
        }

    </style>

    <div id="main">
        <form action="">

            <input type="text" placeholder= "Name">

            <input type="submit">
        </form>
