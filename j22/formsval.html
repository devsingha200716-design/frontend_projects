<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        html, body{

            width: 100%;

        small{

        }

        }
    </style>
</head>
<body>

        <div id="hide">
            <br>

        </div>
        <br><br>
        <input type="Email" placeholder="Email">
        <br><br>
        <input type="Password" placeholder="Password">
        <br><br>
        <select>

            <option value="female">female</option>
            <option value="Others">Others</option>

        <br><br>
        <textarea placeholder="Tell us about...""></textarea>

        <br><br>
    </form>

    <script src="formsval.js"></script>
</body>
</html>
